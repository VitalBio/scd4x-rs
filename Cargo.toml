[package]
name = "scd4x"
version = "0.6.0"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
documentation = "https://docs.rs/scd4x"
repository = "https://github.com/hauju/scd4x-rs.git"
license = "MIT OR Apache-2.0"
description = "Rust driver for the Sensirion SCD4x series. Carbon Dioxide / Temperature / Humidity sensors."
keywords = ["scd40", "scd41", "sensirion", "driver", "embedded-hal-driver"]
categories = ["embedded", "no-std"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"
default-run = "scd4x-util"

[features]
scd41 = []
util = [ "dep:log", "dep:clap", "dep:simplelog", "dep:humantime", "dep:linux-embedded-hal" ]
embedded-hal-async = [ "dep:embedded-hal-async", "sensirion-i2c/embedded-hal-async"]
defmt = [ "dep:defmt" ]
default = []
thiserror = [ "dep:thiserror", "std" ]
std = []

[dependencies]
sensirion-i2c = { git = "https://github.com/VitalBio/sensirion-i2c-rs.git", rev = "817775866382af493ce4d7a66d61bf19d7db91aa" }
embedded-hal = "0.2"
embedded-hal-async = { version = "1.0.0", optional = true }

defmt = { version = "0.3", optional = true }
thiserror = { version = "2.0.12", optional = true }

log = { version = "0.4.27", default-features = false, optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
linux-embedded-hal = { version = "0.3.2", optional = true }
simplelog = { version = "0.12.0", optional = true }
humantime = { version = "2.2.0", optional = true }


[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh0"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
linux-embedded-hal = "0.3.2"

[[bin]]
name = "scd4x-util"
path = "bin/main.rs"
required-features = ["util"]
